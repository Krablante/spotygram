<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Spotygram</title>
  <desc id="desc">Spotygram in a luminous glass capsule over flowing violet, rose and cyan light.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#191b31"/><stop offset=".53" stop-color="#252044"/><stop offset="1" stop-color="#152e3a"/></linearGradient>
    <linearGradient id="ribbon" x2="1" y2="0"><stop stop-color="#65d2de"/><stop offset=".37" stop-color="#9c7df5"/><stop offset=".7" stop-color="#ee8cb4"/><stop offset="1" stop-color="#f5d9a2"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".28"/><stop offset=".52" stop-color="#e9d8ff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity=".18"/></linearGradient>
    <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".4" stop-color="#91deef" stop-opacity=".5"/><stop offset=".75" stop-color="#f19fbc" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#a788ff" stop-opacity=".58"/><stop offset="1" stop-color="#a788ff" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1280" height="480" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="480" fill="url(#night)"/>
    <ellipse cx="990" cy="62" rx="540" ry="350" fill="url(#halo)"/>
    <path d="M-120 375C225 89 461 376 825 155S1250 175 1400-70" fill="none" stroke="url(#ribbon)" stroke-opacity=".3" stroke-width="95"/>
    <path d="M-120 375C225 89 461 376 825 155S1250 175 1400-70" fill="none" stroke="url(#ribbon)" stroke-opacity=".55" stroke-width="2"/>
    <path d="M-80 480C342 287 489 568 876 349S1251 407 1410 219" fill="none" stroke="url(#ribbon)" stroke-opacity=".19" stroke-width="125"/>
    <rect x="52" y="83" width="1176" height="314" rx="64" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <path d="M114 92h1040" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <rect x="93" y="129" width="176" height="176" rx="56" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <g stroke="#fff" stroke-linecap="round" stroke-width="12" opacity=".95">
      <path d="M141 201v30M169 181v70M198 163v105M226 195v41"/>
