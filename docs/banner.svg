<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Spotygram</title>
  <desc id="desc">Spotygram branding beside a music player on a light surface, with color in the artwork and glass on the playback controls.</desc>
  <defs>
    <linearGradient id="art" x2="1" y2="1"><stop stop-color="#366d98"/><stop offset=".52" stop-color="#6796cb"/><stop offset="1" stop-color="#d17e82"/></linearGradient>
    <linearGradient id="lens" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".92"/><stop offset=".55" stop-color="#dce8f2" stop-opacity=".74"/><stop offset="1" stop-color="#fff" stop-opacity=".84"/></linearGradient>
    <linearGradient id="rim" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#9daec2" stop-opacity=".38"/><stop offset="1" stop-color="#7189a6" stop-opacity=".34"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="15"/></filter>
    <clipPath id="frame"><rect width="1280" height="480" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="480" fill="#fafafc"/>
    <circle cx="104" cy="108" r="36" fill="url(#art)"/>
    <g stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M89 107v8M99 99v25M109 93v35M119 103v16"/></g>
    <text x="154" y="120" fill="#191c26" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" letter-spacing="-2">spotygram</text>
    <text x="84" y="266" fill="#191c26" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="700" letter-spacing="-3">Your music.</text>
    <text x="84" y="341" fill="#191c26" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="700" letter-spacing="-3">From your chats.</text>
    <rect x="786" y="56" width="394" height="365" rx="44" fill="#8492aa" opacity=".18" filter="url(#shadow)"/>
    <rect x="786" y="56" width="394" height="365" rx="44" fill="#f0f2f6"/>
    <rect x="812" y="82" width="342" height="186" rx="25" fill="url(#art)"/>
    <circle cx="992" cy="148" r="69" fill="#f5b874" opacity=".47"/>
    <path d="M812 234c67-59 116-24 181-73s100-37 161-24v131H812" fill="#263b68" opacity=".52"/>
    <text x="818" y="316" fill="#191c26" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Music from your chats</text>
    <text x="818" y="345" fill="#5c6271" font-family="Arial,Helvetica,sans-serif" font-size="16">Listen anywhere</text>
    <rect x="830" y="352" width="310" height="55" rx="26" fill="#788ba5" opacity=".15" filter="url(#shadow)"/>
    <rect x="830" y="352" width="310" height="55" rx="26" fill="url(#lens)" stroke="url(#rim)" stroke-width="2"/>
    <path d="M847 356h272" stroke="#fff" opacity=".8" stroke-width="2" stroke-linecap="round"/>
    <path d="M912 373v16m-9-9 9-7m-9 7 9 9m93-16v16m9-9-9-7m9 7-9 9" fill="none" stroke="#191c26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="958" cy="380" r="19" fill="#191c26"/>
    <path d="m953 370 14 10-14 10z" fill="#fff"/>
  </g>
</svg>
