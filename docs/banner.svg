    <text x="316" y="288" fill="#e1dcef" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="4">MUSIC FROM YOUR CHATS</text>
    <circle cx="1096" cy="240" r="92" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <circle cx="1096" cy="240" r="66" fill="none" stroke="#f6f2ff" stroke-opacity=".28"/>
    <circle cx="1096" cy="240" r="48" fill="none" stroke="#f6f2ff" stroke-opacity=".2"/>
    <circle cx="1096" cy="240" r="12" fill="#f2d2ee"/>
