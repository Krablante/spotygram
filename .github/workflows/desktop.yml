name: Rust preview desktop builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        type: choice
        default: all
        options: [all, linux-x64, windows-x64, macos-x64, macos-arm64]
      recheck_run:
        description: Recheck an existing artifact run instead of rebuilding (optional)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ inputs.target != 'all' && fromJSON(format('["{0}"]', inputs.target)) || fromJSON('["linux-x64","windows-x64","macos-x64","macos-arm64"]') }}
    runs-on: ${{ inputs.recheck_run && matrix.target == 'macos-x64' && 'macos-15' || fromJSON('{"linux-x64":"ubuntu-24.04","windows-x64":"windows-2025","macos-x64":"macos-15-intel","macos-arm64":"macos-15"}')[matrix.target] }}
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set private build state
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('SPOTYGRAM_STATE=' + str(Path(os.environ['RUNNER_TEMP']) / 'spotygram-state') + '\n')
      - name: Install Rust
        if: ${{ !inputs.recheck_run }}
        shell: bash
        run: rustup toolchain install 1.97.0 --profile minimal && rustup default 1.97.0
      - name: Prepare Linux graphics and media integration
        if: runner.os == 'Linux' && !inputs.recheck_run
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdbus-1-dev
      - name: Prepare app icon tools
        if: ${{ !inputs.recheck_run }}
        run: python -m pip install Pillow==12.0.0
      - name: Build portable preview
        if: ${{ !inputs.recheck_run }}
        run: python -B tools/build-rust.py
      - uses: actions/download-artifact@v7
        if: inputs.recheck_run
        with:
          name: spotygram-rust-${{ matrix.target }}
          run-id: ${{ inputs.recheck_run }}
          github-token: ${{ github.token }}
          path: ${{ env.SPOTYGRAM_STATE }}/rust/recheck
      - name: Prepare existing package
        if: inputs.recheck_run
        shell: python
        run: |
          import hashlib, os, shutil, subprocess, tarfile, zipfile
          from pathlib import Path
          state=Path(os.environ['SPOTYGRAM_STATE'])/'rust'
          target='${{ matrix.target }}'; extension='.tar.gz' if target.startswith('linux') else '.zip'
          archive=next((state/'recheck').rglob('*-'+target+extension))
          assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==archive.with_name(archive.name+'.sha256').read_text().split()[0]
          image=state/'images'/target; image.parent.mkdir(parents=True)
          if target.startswith('macos'):
              image.mkdir(); subprocess.run(['ditto','-x','-k',archive,image],check=True)
          else:
              unpack=state/'unpack'; unpack.mkdir()
              if target.startswith('linux'):
                  with tarfile.open(archive) as package: package.extractall(unpack,filter='data')
              else:
                  with zipfile.ZipFile(archive) as package: package.extractall(unpack)
              shutil.move(unpack/'spotygram-rust',image)
      - name: Prepare Rosetta for Intel package verification
        if: inputs.recheck_run && matrix.target == 'macos-x64'
        run: /usr/bin/arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Verify packaged native engines
        if: ${{ !(inputs.recheck_run && matrix.target == 'macos-x64') }}
        shell: python
        run: |
          import ctypes, os, platform, subprocess
          from pathlib import Path
          root=Path(os.environ['SPOTYGRAM_STATE'])/'rust/images'/'${{ matrix.target }}'
          system=platform.system()
          binary=root/'bin' if system=='Linux' else root/'spotygram rust.app/Contents/MacOS' if system=='Darwin' else root
          executable=binary/('spotygram-rust.exe' if system=='Windows' else 'spotygram-rust')
          subprocess.run([executable,'--version'],check=True)
          native=binary.parent/'Frameworks' if system=='Darwin' else binary/'native'
          if system=='Windows':
              with os.add_dll_directory(str(native)):
                  td=ctypes.WinDLL(str(native/'tdjson.dll')); mpv=ctypes.WinDLL(str(native/'libmpv-2.dll'))
          else:
              extension='dylib' if system=='Darwin' else 'so'
              if system=='Linux':
                  environment=dict(os.environ,LD_LIBRARY_PATH=str(native))
                  subprocess.run(['python','-c',f'import ctypes; ctypes.CDLL({str(native/"libtdjson.so")!r}); ctypes.CDLL({str(native/"libmpv.so")!r})'],env=environment,check=True)
              else:
                  td=ctypes.CDLL(str(native/f'libtdjson.{extension}')); mpv=ctypes.CDLL(str(native/f'libmpv.{extension}'))
      - name: Open the packaged desktop interface
        if: runner.os != 'Linux'
        shell: python
        run: |
          import json, os, re, shutil, subprocess, time, urllib.request
          from pathlib import Path
          state=Path(os.environ['SPOTYGRAM_STATE'])/'rust'
          root=state/'images'/'${{ matrix.target }}'
          binary=root/'spotygram rust.app/Contents/MacOS/spotygram-rust' if os.name!='nt' else root/'spotygram-rust.exe'
          evidence=state/'verification'; evidence.mkdir()
          subprocess.run([str(binary),'--version'],check=True)
          if os.name=='nt':
              import ctypes, uuid
              class GUID(ctypes.Structure):
                  _fields_=[('Data1',ctypes.c_uint32),('Data2',ctypes.c_uint16),('Data3',ctypes.c_uint16),('Data4',ctypes.c_ubyte*8)]
              factory=ctypes.c_void_p(); adapter=ctypes.c_void_p()
              iid=GUID.from_buffer_copy(uuid.UUID('50c83a1c-e072-4c48-87b0-3630fa36a6d0').bytes_le)
              create=ctypes.WinDLL('dxgi').CreateDXGIFactory2
              create.argtypes=[ctypes.c_uint,ctypes.POINTER(GUID),ctypes.POINTER(ctypes.c_void_p)]; create.restype=ctypes.c_long
              if create(0,ctypes.byref(iid),ctypes.byref(factory)): raise RuntimeError('DXGI factory probe failed')
              enum_address=ctypes.cast(factory,ctypes.POINTER(ctypes.POINTER(ctypes.c_void_p))).contents[7]
              enum_adapter=ctypes.WINFUNCTYPE(ctypes.c_long,ctypes.c_void_p,ctypes.c_uint,ctypes.POINTER(ctypes.c_void_p))(enum_address)
              if enum_adapter(factory,0,ctypes.byref(adapter)): raise RuntimeError('DXGI first-adapter probe failed')
              device=ctypes.c_void_p(); context=ctypes.c_void_p(); level=ctypes.c_uint(0xb000)
              probe=ctypes.WinDLL('d3d11').D3D11CreateDevice
              probe.argtypes=[ctypes.c_void_p,ctypes.c_uint,ctypes.c_void_p,ctypes.c_uint,ctypes.POINTER(ctypes.c_uint),ctypes.c_uint,ctypes.c_uint,ctypes.POINTER(ctypes.c_void_p),ctypes.c_void_p,ctypes.POINTER(ctypes.c_void_p)]
              probe.restype=ctypes.c_long
              result=probe(adapter,0,None,0x820,ctypes.byref(level),1,7,ctypes.byref(device),None,ctypes.byref(context))&0xffffffff
              for pointer in (context,device,adapter,factory):
                  if pointer.value:
                      release=ctypes.cast(pointer,ctypes.POINTER(ctypes.POINTER(ctypes.c_void_p))).contents[2]
                      ctypes.WINFUNCTYPE(ctypes.c_ulong,ctypes.c_void_p)(release)(pointer)
              (evidence/'graphics.json').write_text(json.dumps({'D3D11_first_adapter_video_BGRA_level11':hex(result)}))
              if result==0x887a0004:
                  print('::notice::Native Windows rendering is blocked: this runner lacks the required Direct3D adapter. Package/native-engine checks passed; this is not a visual pass.')
                  raise SystemExit(0)
              if result: raise RuntimeError(f'D3D11 graphics probe failed: {result:#x}')
          environment=dict(os.environ,SPOTYGRAM_RUST_PROFILE=str(state/'verification-profile'),SPOTYGRAM_AUDIO_OUTPUT='null')
          with (evidence/'launch.log').open('wb') as log:
              app=subprocess.Popen([str(binary),'--remote=46871'],env=environment,stdout=log,stderr=log)
              try:
                  deadline=time.monotonic()+45
                  while True:
                      try:
                          with urllib.request.urlopen('http://127.0.0.1:46871/snap?q=heading',timeout=2) as response:
                              snapshot=json.load(response)
                          if snapshot.get('s'): break
                      except OSError: pass
                      if app.poll() is not None or time.monotonic()>deadline: raise RuntimeError('Packaged interface did not open')
                      time.sleep(0.5)
                  for index in range(3):
                      time.sleep(1)
                      with urllib.request.urlopen('http://127.0.0.1:46871/g',timeout=15) as response: grab=json.load(response)
                      shutil.copy2(grab['png'],evidence/f'interface-{index}.png')
                  shutil.copy2(evidence/'interface-2.png',evidence/'interface.png')
                  for endpoint in ('snap','log'):
                      with urllib.request.urlopen('http://127.0.0.1:46871/'+endpoint,timeout=5) as response:
                          (evidence/(endpoint+'.json')).write_bytes(response.read())
                  with urllib.request.urlopen('http://127.0.0.1:46871/quit?if_user_seq=0',timeout=5) as response: response.read()
                  app.wait(timeout=15)
                  if app.returncode: raise RuntimeError(f'Interface exit code: {app.returncode}')
                  log.flush()
                  errors=[line for line in (evidence/'launch.log').read_text(errors='replace').splitlines()
                          if re.search(r'\[E\].*(?:src/(?:app|ui|design)\.rs|shader|script)|panicked at',line)]
                  if errors: raise RuntimeError('Interface script/shader failure: '+errors[0])
              finally:
                  if app.poll() is None: app.terminate(); app.wait(timeout=10)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotygram-rust-${{ matrix.target }}
          path: |
            ${{ env.SPOTYGRAM_STATE }}/rust/releases/*/*
            ${{ env.SPOTYGRAM_STATE }}/rust/verification/*
          if-no-files-found: error
          retention-days: 7
