name: Desktop release assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      DESKTOP_RELEASE_KEY: ${{ secrets.DESKTOP_RELEASE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set private build state
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('SPOTYGRAM_STATE=' + str(Path(os.environ['RUNNER_TEMP']) / 'spotygram-state') + '\n')
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare Linux packaging
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils
      - name: Prepare Windows packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne 'F3C42116542C4CC57263C5BA6C4FEABFC49FE771F2F98A79D2F7628B8762723B') { throw 'Inno Setup checksum mismatch' }
          $tools = Join-Path $env:SPOTYGRAM_STATE 'desktop/tools/inno-6.4.3'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=`"$tools`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup preparation failed: $($process.ExitCode)" }
          "INNO_SETUP_COMPILER=$tools\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and sign
        run: python tools/build-desktop.py
      - uses: actions/upload-artifact@v7
        with:
          name: spotygram-${{ matrix.target }}
          path: ${{ env.SPOTYGRAM_STATE }}/releases/*/*
          if-no-files-found: error
          retention-days: 7
