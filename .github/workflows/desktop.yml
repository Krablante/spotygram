name: Desktop release assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2022
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      DESKTOP_RELEASE_KEY: ${{ secrets.DESKTOP_RELEASE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set private build state
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('SPOTYGRAM_STATE=' + str(Path(os.environ['RUNNER_TEMP']) / 'spotygram-state') + '\n')
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and sign
        run: python tools/build-desktop.py
      - uses: actions/upload-artifact@v7
        with:
          name: spotygram-${{ matrix.target }}
          path: ${{ env.SPOTYGRAM_STATE }}/releases/*/*
          if-no-files-found: error
          retention-days: 7
